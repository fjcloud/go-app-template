apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortune-cookie
  labels:
    app.kubernetes.io/name: fortune-cookie
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fortune-cookie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortune-cookie
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortune-cookie
          image: placeholder
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
