apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-desk
  labels:
    app.kubernetes.io/name: signal-desk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-desk
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        app.kubernetes.io/name: signal-desk
    spec:
      serviceAccountName: signal-desk
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: signal-desk
        image: image-registry.openshift-image-registry.svc:5000/signal-desk-build/signal-desk:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: signal-desk-config
        env:
        - name: LISTEN_ADDR
          value: :8080
        - name: SERVICE_CA_FILE
          value: /etc/service-ca/service-ca.crt
        - name: DATA_DIR
          value: /data
        - name: AGENT_URL
          value: http://lsd-genai-playground-service.signal-desk-dev.svc.cluster.local:8321/v1
        - name: AGENT_MODEL
          value: maas-vllm-inference-1/deepseekv4pro
        - name: AGENT_KEY_FILE
          value: /etc/model/api-key
        volumeMounts:
        - name: service-ca
          mountPath: /etc/service-ca
          readOnly: true
        - name: data
          mountPath: /data
        - name: model
          mountPath: /etc/model
          readOnly: true
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: service-ca
        configMap:
          name: signal-desk-service-ca
      - name: data
        persistentVolumeClaim:
          claimName: signal-desk-data
      - name: model
        secret:
          secretName: signal-desk-model
  strategy:
    type: Recreate
