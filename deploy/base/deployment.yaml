apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-transcript
  labels:
    app.kubernetes.io/name: live-transcript
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: live-transcript
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        app.kubernetes.io/name: live-transcript
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: live-transcript
          image: image-registry.openshift-image-registry.svc:5000/live-transcript-build/live-transcript:latest
          imagePullPolicy: Always
          env:
            - name: WHISPER_URL
              value: http://whisper-predictor.speech-serving.svc.cluster.local/v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
