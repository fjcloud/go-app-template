apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-desk
  labels:
    app.kubernetes.io/name: signal-desk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-desk
  template:
    metadata:
      annotations:
        openshift.io/required-scc: restricted-v2
      labels:
        app.kubernetes.io/name: signal-desk
    spec:
      serviceAccountName: signal-desk
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: signal-desk
        image: image-registry.openshift-image-registry.svc:5000/signal-desk-build/signal-desk:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: signal-desk-config
        env:
        - name: LISTEN_ADDR
          value: :8080
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
  strategy:
    type: Recreate
