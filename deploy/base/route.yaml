apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: live-transcript
  annotations:
    haproxy.router.openshift.io/timeout: 60s
  labels:
    app.kubernetes.io/name: live-transcript
spec:
  to:
    kind: Service
    name: live-transcript
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
