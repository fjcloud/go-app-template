apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: card-scout
  annotations:
    haproxy.router.openshift.io/timeout: 120s
  labels:
    app.kubernetes.io/name: card-scout
spec:
  to:
    kind: Service
    name: card-scout
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
