<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Scout</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f4f5f7; color: #1a1a2e; min-height: 100vh; }
header { background: #1a1a2e; color: #fff; padding: 12px 20px; }
header h1 { font-size: 1.3rem; font-weight: 600; }
header p { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }
.container { max-width: 1200px; margin: 0 auto; padding: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.btn { padding: 8px 18px; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; font-weight: 500; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: #4361ee; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #3a56d4; }
.btn-outline { background: #fff; border: 1.5px solid #ccc; color: #333; }
.btn-outline:hover:not(:disabled) { border-color: #888; }
.progress { font-size: 0.85rem; color: #555; margin-left: 8px; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filter-pill { padding: 5px 14px; border-radius: 16px; border: 1.5px solid #ccc; background: #fff; font-size: 0.8rem; cursor: pointer; }
.filter-pill:hover { border-color: #888; }
.filter-pill.active { background: #4361ee; color: #fff; border-color: #4361ee; }
.filter-count { font-size: 0.78rem; color: #777; margin-left: 4px; }
.summary { font-size: 0.82rem; color: #555; margin-bottom: 12px; }
.price-panel { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; display: none; }
.price-panel.visible { display: block; }
.price-panel h3 { font-size: 1rem; margin-bottom: 10px; color: #1a1a2e; }
.price-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.price-item { font-size: 0.82rem; }
.price-item strong { display: block; font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.price-item .unavailable { color: #999; font-style: italic; }
.price-links { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; }
.price-links a { font-size: 0.82rem; color: #4361ee; }
.error-msg { font-size: 0.82rem; color: #c53030; margin-top: 6px; }
.status-pending { color: #a0aec0; }
.status-analyzing { color: #d69e2e; }
.status-done { color: #38a169; }
.status-error { color: #e53e3e; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-bottom: 16px; }
.card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
.card img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
.card-body { padding: 10px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.card-name { font-weight: 600; font-size: 0.92rem; }
.card-set { font-size: 0.78rem; color: #666; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
.badge-rare { background: #f6e05e; color: #744210; }
.badge-uncommon { background: #cbd5e0; color: #2d3748; }
.badge-common { background: #ed8936; color: #7b341e; }
.badge-uncertain { background: #e2e8f0; color: #4a5568; }
.badge-other { background: #fed7d7; color: #9b2c2c; }
.badge-na { background: #e2e8f0; color: #718096; }
.card-actions { padding: 8px 12px; border-top: 1px solid #eee; display: flex; gap: 6px; }
.card-actions .btn { font-size: 0.78rem; padding: 5px 12px; }
.empty-state { text-align: center; padding: 40px 20px; color: #888; font-size: 0.95rem; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #4361ee; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card img { height: 130px; }
  .container { padding: 10px; }
}
</style>
</head>
<body>
<header>
  <h1>Card Scout</h1>
  <p id="dataset-desc">Loading dataset...</p>
</header>
<div class="container">
  <div class="controls">
    <button id="analyze-btn" class="btn btn-primary" onclick="startAnalysis()">Analyze batch</button>
    <button id="retry-btn" class="btn btn-outline" style="display:none;" onclick="loadBatch()">Retry</button>
    <span id="progress-msg" class="progress"></span>
  </div>
  <div class="filter-bar">
    <button class="filter-pill active" data-filter="all" onclick="setFilter('all', this)">All <span class="filter-count" id="count-all"></span></button>
    <button class="filter-pill" data-filter="rare" onclick="setFilter('rare', this)">Rare <span class="filter-count" id="count-rare"></span></button>
    <button class="filter-pill" data-filter="review" onclick="setFilter('review', this)">Needs review <span class="filter-count" id="count-review"></span></button>
    <button class="filter-pill" data-filter="other" onclick="setFilter('other', this)">Other <span class="filter-count" id="count-other"></span></button>
  </div>
  <div class="summary" id="summary"></div>
  <div id="price-panel" class="price-panel"></div>
  <div class="grid" id="grid"></div>
  <button id="show-more" class="btn btn-outline" style="display:none;margin:0 auto;" onclick="showMore()">Show more</button>
  <div class="empty-state" id="empty-state" style="display:none;">No cards match this filter.</div>
</div>

<script>
var state = {items:[], running:false, completed:0, failed:0, filter:'all', showing:12, polling:null, researching:null, batchError:false};

function fmtUnavail(v) { return v===null||v===undefined ? '<span class="unavailable">Unavailable</span>' : v; }

function fmtPrice(v) { return v===null||v===undefined ? '<span class="unavailable">Unavailable</span>' : (v===0 ? '0' : v); }

function isSafeURL(u) { return u && typeof u==='string' && (u.startsWith('https://')||u.startsWith('http://')) && !u.startsWith('javascript:') && !u.startsWith('data:') && !u.startsWith('vbscript:'); }

function restoreFilter() {
  try { var f=localStorage.getItem('cardscout-filter'); if (f && filterFn[f]) state.filter = f; } catch(e){}
}

function saveFilter() {
  try { localStorage.setItem('cardscout-filter', state.filter); } catch(e){}
}

async function loadBatch() {
  try {
    var r = await fetch('/api/batch');
    if (!r.ok) {
      if (state.items.length === 0) {
        document.getElementById('progress-msg').textContent = 'Failed to load batch.';
        document.getElementById('retry-btn').style.display = 'inline-block';
        state.batchError = true;
      }
      return;
    }
    state.batchError = false;
    document.getElementById('retry-btn').style.display = 'none';
    var d = await r.json();
    state.items = d.items || [];
    state.running = !!d.running;
    state.completed = d.completed || 0;
    state.failed = d.failed || 0;
    document.getElementById('dataset-desc').textContent =
      (d.dataset ? d.dataset.name + ' — ' + d.dataset.items + ' items, ' + d.dataset.years : 'Card Scout');
    updateUI();

    var items = state.items;
    document.getElementById('count-all').textContent = '(' + items.length + ')';
    document.getElementById('count-rare').textContent = '(' + items.filter(function(it){return it.kind==='pokemon_tcg' && it.rarity==='rare_or_higher'}).length + ')';
    document.getElementById('count-review').textContent = '(' + items.filter(function(it){return it.needs_review}).length + ')';
    document.getElementById('count-other').textContent = '(' + items.filter(function(it){return it.kind==='other_card' || it.kind==='not_a_card'}).length + ')';

    if (state.running) startPolling();
    else stopPolling();
  } catch(e) {
    if (state.items.length === 0) {
      document.getElementById('progress-msg').textContent = 'Connection error.';
      document.getElementById('retry-btn').style.display = 'inline-block';
      state.batchError = true;
    }
  }
}

function startPolling() {
  if (state.polling) return;
  state.polling = setInterval(loadBatch, 1000);
}

function stopPolling() {
  if (state.polling) { clearInterval(state.polling); state.polling = null; }
}

async function startAnalysis() {
  var btn = document.getElementById('analyze-btn');
  btn.disabled = true;
  document.getElementById('progress-msg').textContent = 'Starting analysis...';
  try {
    var r = await fetch('/api/batch/analyze', {method:'POST'});
    if (r.status === 202 || r.ok) {
      state.running = true;
      startPolling();
      document.getElementById('progress-msg').textContent = 'Analysis running...';
    } else {
      var err = await r.json().catch(function(){return {error:'Request failed'}});
      document.getElementById('progress-msg').textContent = (err.error || 'Analysis request failed');
      btn.disabled = false;
    }
  } catch(e) {
    document.getElementById('progress-msg').textContent = 'Connection error.';
    btn.disabled = false;
  }
}

function updateUI() {
  var btn = document.getElementById('analyze-btn');
  btn.disabled = state.running || state.batchError;
  if (state.running) {
    document.getElementById('progress-msg').textContent = 'Analyzing: ' + state.completed + ' completed, ' + state.failed + ' failed...';
  } else if (state.completed > 0 || state.failed > 0) {
    document.getElementById('progress-msg').textContent = 'Done: ' + state.completed + ' completed, ' + state.failed + ' failed.';
  } else {
    document.getElementById('progress-msg').textContent = '';
  }
  renderGrid();
}

var filterFn = {all:function(){return true}, rare:function(it){return it.kind==='pokemon_tcg'&&it.rarity==='rare_or_higher'},
  review:function(it){return it.needs_review}, other:function(it){return it.kind==='other_card'||it.kind==='not_a_card'}};

function setFilter(f, el) {
  state.filter = f; state.showing = 12;
  saveFilter();
  document.querySelectorAll('.filter-pill').forEach(function(p){p.classList.remove('active')});
  el.classList.add('active');
  renderGrid();
}

function filtered() { return state.items.filter(filterFn[state.filter]); }

function renderGrid() {
  var f = filtered();
  var visible = f.slice(0, state.showing);
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty-state');
  var more = document.getElementById('show-more');
  document.getElementById('summary').textContent = f.length + ' cards';
  if (f.length === 0) { grid.innerHTML = ''; empty.style.display = 'block'; more.style.display = 'none'; return; }
  empty.style.display = 'none';
  grid.innerHTML = visible.map(function(it){
    var statusLabel = it.status || 'pending';
    var statusClass = 'status-'+statusLabel;
    var rarityBadge = '';
    if (it.rarity) {
      var rc = it.rarity.replace(/_/g,' ').replace(/\b\w/g,function(l){return l.toUpperCase()});
      var bc = 'badge-uncertain';
      if (it.rarity==='rare_or_higher') bc='badge-rare';
      else if (it.rarity==='uncommon') bc='badge-uncommon';
      else if (it.rarity==='common') bc='badge-common';
      else if (it.rarity==='not_applicable') bc='badge-na';
      rarityBadge = '<span class="badge '+bc+'">'+rc+'</span>';
    }
    var kindBadge = '';
    if (it.kind==='other_card'||it.kind==='not_a_card') kindBadge = '<span class="badge badge-other">'+it.kind.replace(/_/g,' ')+'</span>';
    var reviewBadge = it.needs_review ? '<span class="badge badge-other">Needs review</span>' : '';
    var canCheck = it.status==='done' && it.kind==='pokemon_tcg';
    var researchInfo = '';
    if (it.research) {
      var r=it.research, trend=fmtUnavail(r.trend), avg=fmtUnavail(r.average_7d);
      researchInfo = '<div style="font-size:0.75rem;color:#555;margin-top:4px;">Trend: '+trend+' / 7d avg: '+avg+'</div>';
    }
    return '<div class="card">'+
      '<img src="'+htmlEscape(it.image_url||'')+'" alt="Card" loading="lazy">'+
      '<div class="card-body">'+
        '<div class="card-name">'+htmlEscape(it.name||'Unknown')+'</div>'+
        '<div class="card-set">' + htmlEscape((it.set_name||'')+' '+(it.year||'')) + '</div>'+
        '<div class="badges">'+kindBadge+rarityBadge+reviewBadge+'<span class="badge '+statusClass+'">'+statusLabel+'</span></div>'+
        researchInfo+
      '</div>'+
      '<div class="card-actions">'+
        (canCheck ? '<button class="btn btn-primary" onclick="checkPrice(\''+htmlEscape(it.id)+'\',\''+htmlEscape(it.name||'')+'\')">Check price</button>' : '<button class="btn btn-outline" disabled>Check price</button>')+
      '</div>'+
    '</div>';
  }).join('');
  more.style.display = visible.length < f.length ? 'block' : 'none';
}

function showMore() { state.showing += 12; renderGrid(); }

function htmlEscape(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

async function checkPrice(id, cardName) {
  var panel = document.getElementById('price-panel');
  if (state.researching) return;
  state.researching = id;
  panel.className = 'price-panel visible';
  var nameDisplay = htmlEscape(cardName || id);
  panel.innerHTML = '<h3>Checking price for '+nameDisplay+'...</h3><div class="spinner"></div>';
  try {
    var r = await fetch('/api/cards/'+encodeURIComponent(id)+'/research', {method:'POST'});
    var d = await r.json();
    if (!r.ok) {
      var err = (d && d.error) ? d.error : ('Request failed ('+r.status+')');
      panel.innerHTML = '<h3>'+nameDisplay+'</h3><div class="error-msg">'+htmlEscape(err)+'</div>';
    } else if (d.status==='ok') {
      var card = d.card||{};
      var srcLink = '';
      var traceLink = '';
      if (d.source_url && isSafeURL(d.source_url)) {
        srcLink = '<a href="'+htmlEscape(d.source_url)+'" target="_blank" rel="noopener">Source</a>';
      }
      if (d.trace_url && isSafeURL(d.trace_url)) {
        traceLink = '<a href="'+htmlEscape(d.trace_url)+'" target="_blank" rel="noopener">View MLflow trace</a>';
      }
      panel.innerHTML = '<h3>'+htmlEscape(card.name||id)+'</h3>'+
        '<div class="price-grid">'+
          '<div class="price-item"><strong>Name</strong>'+htmlEscape(card.name||'—')+'</div>'+
          '<div class="price-item"><strong>Set</strong>'+htmlEscape(card.set||'—')+'</div>'+
          '<div class="price-item"><strong>Number</strong>'+htmlEscape(card.number||'—')+'</div>'+
          '<div class="price-item"><strong>Catalogue rarity</strong>'+htmlEscape(card.rarity||'—')+'</div>'+
          '<div class="price-item"><strong>Trend</strong>'+fmtPrice(d.trend)+'</div>'+
          '<div class="price-item"><strong>7-day average</strong>'+fmtPrice(d.average_7d)+'</div>'+
          '<div class="price-item"><strong>Provider</strong>'+htmlEscape(d.provider||'—')+'</div>'+
          '<div class="price-item"><strong>Currency</strong>'+htmlEscape(d.currency||'—')+'</div>'+
          '<div class="price-item"><strong>Provider updated</strong>'+htmlEscape(d.provider_updated_at||'—')+'</div>'+
          '<div class="price-item"><strong>Retrieved</strong>'+htmlEscape(d.retrieved_at||'—')+'</div>'+
        '</div>'+
        '<div class="price-links">'+srcLink+traceLink+'</div>';
    } else {
      panel.innerHTML = '<h3>'+nameDisplay+'</h3><div class="error-msg">Unexpected response.</div>';
    }
  } catch(e) {
    panel.innerHTML = '<h3>'+nameDisplay+'</h3><div class="error-msg">Connection error: '+htmlEscape(e.message)+'</div>';
  }
  state.researching = null;
}

restoreFilter();
(function(){
  var pills = document.querySelectorAll('.filter-pill');
  pills.forEach(function(p){
    p.classList.remove('active');
    if (p.getAttribute('data-filter') === state.filter) p.classList.add('active');
  });
})();
loadBatch();
</script>
</body>
</html>
