---
- name: Push code to personal Git server repository
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_root: "{{ playbook_dir }}/.."
    app_name: "{{ lookup('env', 'APP_NAME') | default('fortune-cookie') }}"
    git_server: "{{ lookup('env', 'GIT_SERVER') }}"
    git_email: "{{ lookup('env', 'GIT_EMAIL') | default('dev@workshop.local') }}"
    git_name: "{{ lookup('env', 'GIT_NAME') | default('Developer') }}"

  tasks:
    - name: Remove existing origin remote
      ansible.builtin.command: git remote remove origin
      args:
        chdir: "{{ project_root }}"
      ignore_errors: true

    - name: Create repository on Git server
      ansible.builtin.command: gitpop init --host {{ git_server }} --name {{ app_name }}
      args:
        chdir: "{{ project_root }}"

    - name: Configure git identity
      ansible.builtin.shell: |
        git config user.email "{{ git_email }}"
        git config user.name  "{{ git_name }}"
      args:
        chdir: "{{ project_root }}"

    - name: Stage and commit all files
      ansible.builtin.shell: |
        git add -A
        git commit -m "feat: {{ app_name }} initial implementation" || true
      args:
        chdir: "{{ project_root }}"

    - name: Push to Git server
      ansible.builtin.command: git push -u origin main
      args:
        chdir: "{{ project_root }}"

    - name: Get repository URL
      ansible.builtin.command: git remote get-url origin
      args:
        chdir: "{{ project_root }}"
      register: repo_url

    - name: Print result
      ansible.builtin.debug:
        msg: "Repo: {{ repo_url.stdout }}"
