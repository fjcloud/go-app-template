---
- name: Deploy application via developer-owned Argo CD
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    K8S_AUTH_KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') | default('/home/user/.kube/config') }}"
  vars:
    project_root: "{{ playbook_dir }}/.."
    app_name: "{{ lookup('env', 'APP_NAME') or 'fortune-cookie' }}"
    dev_ns: "{{ app_name }}-dev"
    build_ns: "{{ app_name }}-build"
    image: "image-registry.openshift-image-registry.svc:5000/{{ app_name }}-build/{{ app_name }}:latest"

  tasks:
    - name: Get repository URL
      ansible.builtin.command: git remote get-url origin
      args:
        chdir: "{{ project_root }}"
      register: repo_url

    - name: Create dev project
      ansible.builtin.command: oc new-project {{ dev_ns }}
      ignore_errors: true

    - name: Allow dev namespace to pull images from build namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: image-puller
            namespace: "{{ build_ns }}"
          subjects:
            - kind: ServiceAccount
              name: default
              namespace: "{{ dev_ns }}"
          roleRef:
            kind: ClusterRole
            name: system:image-puller
            apiGroup: rbac.authorization.k8s.io

    - name: Update image reference in deployment manifest
      ansible.builtin.replace:
        path: "{{ project_root }}/deploy/base/deployment.yaml"
        regexp: 'image: .*'
        replace: "image: {{ image }}"

    - name: Commit and push updated manifest
      ansible.builtin.shell: |
        git add deploy/base/deployment.yaml
        git commit -m "ci: update image to {{ app_name }}:latest" || true
        git push
      args:
        chdir: "{{ project_root }}"

    - name: Deploy developer-owned Argo CD instance
      kubernetes.core.k8s:
        state: present
        namespace: "{{ dev_ns }}"
        definition: "{{ lookup('kubernetes.core.kustomize', dir=project_root + '/gitops/base') }}"

    - name: Wait for Argo CD instance to become Available
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1beta1
        kind: ArgoCD
        name: argocd
        namespace: "{{ dev_ns }}"
      register: argocd_status
      until: >
        argocd_status.resources | length > 0 and
        argocd_status.resources[0].status.phase | default('') == 'Available'
      retries: 30
      delay: 10

    - name: Create Argo CD Application
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ dev_ns }}"
          spec:
            project: default
            source:
              repoURL: "{{ repo_url.stdout | trim }}"
              targetRevision: main
              path: deploy/base
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ dev_ns }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true

    - name: Wait for application to sync and become Healthy
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ app_name }}"
        namespace: "{{ dev_ns }}"
      register: app_status
      until: >
        app_status.resources | length > 0 and
        app_status.resources[0].status.sync.status | default('') == 'Synced' and
        app_status.resources[0].status.health.status | default('') == 'Healthy'
      retries: 30
      delay: 10

    - name: Show application URLs
      ansible.builtin.debug:
        msg:
          - "App:    https://{{ lookup('kubernetes.core.k8s', api_version='route.openshift.io/v1', kind='Route', namespace=dev_ns, resource_name=app_name).spec.host }}"
          - "ArgoCD: https://{{ lookup('kubernetes.core.k8s', api_version='route.openshift.io/v1', kind='Route', namespace=dev_ns, resource_name='argocd-server').spec.host }}"
